<!doctype html>
<html lang="en" data-theme="classic">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cost Guard Web Beta</title><link rel="stylesheet" href="/app.css">
<link rel="icon" href="/favicon-cg1.ico" type="image/x-icon" sizes="16x16 20x20 24x24 32x32 48x48">
<script src="/help.js" defer></script><script src="/render.js" defer></script><script src="/token-mix.js" defer></script><script src="/account-cards.js" defer></script><script src="/watch.js" defer></script><script src="/reports.js" defer></script><script src="/live.js" defer></script><script src="/session.js" defer></script><script src="/sessions.js" defer></script><script src="/settings.js" defer></script><script src="/mini.js" defer></script><script src="/app.js" defer></script></head>
<body data-section="models">
<button class="skip" id="skip">Skip to report</button>
<header><div class="brand"><span class="brand-mark" aria-hidden="true">CG</span><h1>Cost Guard <small>Web Beta<span id="product-version"></span></small></h1></div>
<span id="status" class="sr-only" role="status"></span></header>
<nav aria-label="Main navigation">
<a href="#/models">Models</a><a href="#/watch">Watch</a><a href="#/sessions">Sessions</a>
<a href="#/accounts">Accounts</a>
<a href="#/token-mix">Token Mix</a><a href="#/cost-per-hour">Cost per Active Hour</a>
<a href="#/settings" class="settings-link">Settings</a></nav>
<aside id="host-state" class="host-state" hidden><details><summary id="host-warning">Connection warning</summary><div id="host-details-panel"><p id="host-message"></p><p id="host-details"></p></div></details></aside>
<main id="content" tabindex="-1">
<div class="toolbar"><h2 id="heading">Models</h2>
<button id="refresh" class="primary" disabled>Refresh snapshot</button><button id="cancel" disabled>Cancel</button></div>
<p id="notice" role="status">Cost Guard is starting. Establishing your private browser session before requesting data…</p>
<div id="scope-controls"></div>
<div id="mini-watch-controls"><button id="mini-watch-toggle" type="button" aria-pressed="false" aria-describedby="mini-watch-feedback">Mini Watch: Off</button><span id="mini-watch-feedback" role="status"></span></div>
<label class="report-search">Search displayed report tables <input id="search" type="search" placeholder="Presentation filter only"></label>
<div id="result" aria-busy="true"><div class="overview-loading"><progress max="100" value="0" aria-label="Initial report progress" aria-valuetext="Approximately 0 percent"></progress><p role="status">≈0% · Authorizing browser session…</p></div></div>
</main>
</body></html>

name: Cost Guard Web revalidation
# Keep detailed verification results in this run / the PR, not a follow-up
# reporting commit. PR paths are cumulative: a report-only follow-up on a
# code-changing PR still reruns these checks. No unverified phase skipping.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['src/**', 'config/default-config.jsonc', '*cost-guard*.py', 'windows/**', 'macos/**', 'development/tests/**', 'development/tools/**', '.github/workflows/*.yml']
  push:
    branches: [main]
    paths: ['src/**', 'config/default-config.jsonc', '*cost-guard*.py', 'windows/**', 'macos/**', 'development/tests/**', 'development/tools/**', '.github/workflows/*.yml']
permissions:
  contents: read
concurrency:
  group: web-beta-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONIOENCODING: utf-8
  COST_GUARD_TEST_MODE: '1'
jobs:
  common:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright/python:v1.56.0-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Quick units and package validation (Full on manual dispatch)
        run: python development/tools/ci_web_beta.py regression --scope common
      # The matching image supplies Chromium and its Linux libraries. Keep the
      # Python binding pinned to that browser build; no runtime browser download.
      - name: CI-only version-matched browser binding
        if: ${{ !cancelled() }}
        run: |
          python -m pip install playwright==1.56.0
      - name: Rendered browser smoke (once)
        if: ${{ !cancelled() }}
        run: python development/tools/ci_web_beta.py browser --scope common
      - name: Scoped coverage summary
        if: always()
        env:
          CI_JOB_STATUS: ${{ job.status }}
        run: python development/tools/ci_web_beta.py summary --scope common
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: web-beta-common-linux
          path: ci-results/*.json
          retention-days: 7
          if-no-files-found: error

name: Cost Guard Web revalidation
# Keep detailed verification results in this run / the PR, not a follow-up
# reporting commit. PR paths are cumulative: a report-only follow-up on a
# code-changing PR still reruns these checks. No unverified phase skipping.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['src/**', 'config/default-config.jsonc', 'windows/**', 'macos/**', 'development/tests/**', 'development/tools/**', '.github/workflows/*.yml']
  push:
    branches: [main]
    paths: ['src/**', 'config/default-config.jsonc', 'windows/**', 'macos/**', 'development/tests/**', 'development/tools/**', '.github/workflows/*.yml']
permissions:
  contents: read
concurrency:
  group: web-beta-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONIOENCODING: utf-8
  COST_GUARD_TEST_MODE: '1'
jobs:
  common:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright/python:v1.56.0-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Quick units and package validation (Full on manual dispatch)
        run: python development/tools/ci_web_beta.py regression --scope common
      # The matching image supplies Chromium and its Linux libraries. Keep the
      # Python binding pinned to that browser build; no runtime browser download.
      - name: CI-only version-matched browser binding
        if: ${{ !cancelled() }}
        run: |
          python -m pip install playwright==1.56.0
      - name: Rendered browser smoke (once)
        if: ${{ !cancelled() }}
        run: python development/tools/ci_web_beta.py browser --scope common
      - name: Numeric CCost Full and Document PiP regression
        if: ${{ !cancelled() }}
        env:
          COST_GUARD_CI_BROWSER: '1'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          from playwright.sync_api import sync_playwright
          output = Path("ci-results/numeric-tables.json").resolve()
          output.parent.mkdir(parents=True, exist_ok=True)
          with sync_playwright() as playwright:
              browser = playwright.chromium.executable_path
          environment = {**os.environ, "COST_GUARD_TEST_PYTHON": sys.executable}
          result = subprocess.run(["node", "development/tests/integration/probe_web_help.cjs",
                                   browser, str(output), "--numeric-tables"],
                                  env=environment, timeout=210, check=False)
          evidence = json.loads(output.read_text(encoding="utf-8"))
          summary = {key: evidence.get(key) for key in ("outcome", "browser", "checks", "errors", "limitations", "reason", "diagnostic", "layouts")}
          print("::notice title=Numeric CCost PiP::" + json.dumps(summary).replace("%", "%25"))
          result.check_returncode()
          if evidence.get("outcome") != "PASS":
              raise SystemExit("numeric CCost evidence did not pass")
          PY
      - name: Watch header geometry and native Mini opening lifecycle
        if: ${{ !cancelled() }}
        run: python development/tests/integration/ci_watch_header.py
      - name: Calm UI detail recovery, source banner and accessibility regression
        if: ${{ !cancelled() }}
        env:
          COST_GUARD_CI_BROWSER: '1'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          from playwright.sync_api import sync_playwright
          output = Path("ci-results/calm-ui.json").resolve()
          output.parent.mkdir(parents=True, exist_ok=True)
          with sync_playwright() as playwright:
              browser = playwright.chromium.executable_path
          result = subprocess.run(["node", "development/tests/integration/probe_web_sessions.cjs",
                           browser, str(output), "--calm-ui"],
                          env={**os.environ, "COST_GUARD_TEST_PYTHON": sys.executable},
                          timeout=210, check=False)
          try:
              evidence = json.loads(output.read_text(encoding="utf-8"))
              summary = {key: evidence.get(key) for key in ("outcome", "browser", "checks", "layouts", "diagnostic")}
          except (OSError, ValueError) as error:
              summary = {"outcome": "FAIL", "diagnostic": "Missing or malformed Calm UI evidence: " + type(error).__name__}
          print("::notice title=Calm UI::" + json.dumps(summary).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          result.check_returncode()
          if summary.get("outcome") != "PASS":
              raise SystemExit("Calm UI evidence did not pass")
          PY
      # Ordinary affected-source coverage keeps one real 61s hold per document.
      # Manual Full retains all twelve holds and the mixed/control diagnostics.
      - name: Mini keyboard and mouse stationary regression (representative; Full on manual dispatch)
        if: ${{ !cancelled() }}
        run: python development/tests/integration/ci_mini_tooltips.py mouse
      # All rendered checks remain; only manual Full waits five real minutes.
      - name: Token Mix shares, periods, help and performance (real cadence on manual Full)
        if: ${{ !cancelled() }}
        run: python development/tests/integration/ci_token_mix.py
      - name: Mini independent touch regression
        if: ${{ !cancelled() }}
        run: python development/tests/integration/ci_mini_tooltips.py touch
      - name: Mini original mixed-input regression
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
        run: python development/tests/integration/ci_mini_tooltips.py mixed
      - name: Mini unbound native-input diagnostic control
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
        run: python development/tests/integration/ci_mini_tooltips.py control
      - name: Scoped coverage summary
        if: always()
        env:
          CI_JOB_STATUS: ${{ job.status }}
        run: python development/tools/ci_web_beta.py summary --scope common
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: web-beta-common-linux
          path: |
            ci-results/*.json
            ci-results/mini-tooltips*.png
            ci-results/watch-*.png
          retention-days: 7
          if-no-files-found: error
